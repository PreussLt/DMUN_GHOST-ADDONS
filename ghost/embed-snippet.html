<!-- ============================================================
     DMUN Quiz – Embed-Snippet für einen Ghost-Artikel
     Im Ghost-Editor: + → HTML-Karte → diesen Code einfügen.
     data-quiz-id auf die ID deines Quiz setzen.
     data-api-url auf deine öffentliche API-URL setzen.
     ============================================================ -->

<div class="dmun-quiz"
     data-quiz-id="1"
     data-api-url="https://quiz.dmun.de">
</div>
<script src="https://quiz.dmun.de/static/quiz-widget.js"></script>

<!-- Wenn das CSS bereits global (Site Header) eingebunden ist,
     das folgende <link> weglassen: -->
<link rel="stylesheet" href="https://quiz.dmun.de/static/quiz-widget.css">
